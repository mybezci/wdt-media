name: Prune old media

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete media older than 60 days (by filename date)
        run: |
          cutoff="$(date -u -d '60 days ago' +%Y-%m-%d)"
          echo "Cutoff: $cutoff"
          deleted=0
          for f in media/*.jpg; do
            [ -e "$f" ] || continue
            d="$(basename "$f" | grep -oE '^[0-9]{4}-[0-9]{2}-[0-9]{2}')" || continue
            if [ -n "$d" ] && [ "$d" \< "$cutoff" ]; then
              git rm -q "$f"; deleted=$((deleted+1))
            fi
          done
          echo "Deleted: $deleted"
          if [ "$deleted" -gt 0 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: prune $deleted media file(s) older than $cutoff"
            git push
          fi
